
networks:
  cloudvisor:
    driver: bridge

# ─────────────────────────────────────────────────────────────────────────────
# Each backend service loads its own env file from services/<name>/.env
# Docker-specific overrides (container hostnames) are applied on top via
# the `environment:` block, which takes precedence over env_file values.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ─── Reverse Proxy (port 80) — single origin for all services ─────────────

  nginx:
    image: nginx:alpine
    container_name: cv-nginx
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - auth-service
      - api-service
    networks:
      - cloudvisor
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://127.0.0.1:80/auth/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─── Infrastructure ───────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: cv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cvadmin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cvpassword}
      POSTGRES_DB: cloudvisor
    volumes:
      - ./infra/db/postgres:/var/lib/postgresql/data
      - ./infra/db/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - cloudvisor
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "cvadmin"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.15-community
    container_name: cv-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}"
    ports:
      - "7687:7687"
      - "7474:7474"
    volumes:
      - ./infra/db/neo4j:/data
    networks:
      - cloudvisor

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: cv-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx1g
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-elasticpassword}
      - xpack.security.transport.ssl.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - esdata1:/usr/share/elasticsearch/data
    networks:
      - cloudvisor

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: cv-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - cloudvisor

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: cv-kafka
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: cv-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://cv-kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    networks:
      - cloudvisor

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: cv-schema-registry
    restart: unless-stopped
    environment:
      SCHEMA_REGISTRY_HOST_NAME: cv-schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: cv-kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: PLAINTEXT
    ports:
      - "8081:8081"
    depends_on:
      - kafka
    networks:
      - cloudvisor
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    container_name: cv-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - cloudvisor

  opa:
    image: openpolicyagent/opa:latest
    container_name: cv-opa
    restart: unless-stopped
    ports:
      - "8181:8181"
    command: ["run", "--server", "--addr=0.0.0.0:8181"]
    networks:
      - cloudvisor

  adminer:
    image: adminer:latest
    container_name: cv-adminer
    restart: unless-stopped
    ports:
      - "8082:8080"
    depends_on:
      - postgres
    networks:
      - cloudvisor

  # ─── HashiCorp Vault ──────────────────────────────────────────────────────

  vault:
    image: hashicorp/vault:1.15
    container_name: cv-vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
      # SECURITY: Do NOT set VAULT_TOKEN here in production.
      # The root token is written by vault-init to /vault/data/vault_token.
      # Services read it from the shared volume, not from an env var.
      # The value below is only used for the initial vault server startup
      # and is overwritten by vault-init on first run.
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/data
      - vault_logs:/vault/logs
      - ./infra/vault/config:/vault/config:ro
    command: vault server -config=/vault/config/vault.hcl
    networks:
      - cloudvisor
    healthcheck:
      test: ["CMD", "sh", "-c", "VAULT_ADDR=http://127.0.0.1:8200 vault status 2>&1 | grep -q 'Initialized'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  vault-init:
    image: python:3.12-alpine
    container_name: cv-vault-init
    restart: always
    environment:
      VAULT_ADDR: "http://cv-vault:8200"
    command: >
      sh -c "pip install hvac -q && python3 /vault/init/init.py && sleep infinity"
    volumes:
      - vault_data:/vault/data
      - ./infra/vault:/vault/init:ro
    depends_on:
      vault:
        condition: service_started
    networks:
      - cloudvisor



  # ─── Auth Service (port 8002) ─────────────────────────────────────────────

  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: cv-auth
    ports:
      - "8002:8002"
    env_file:
      - services/auth/.env
    environment:
      # Docker network overrides — replace localhost with container names
      DB_URL: postgresql+asyncpg://cvadmin:${POSTGRES_PASSWORD:-cvpassword}@cv-postgres:5432/cloudvisor
      REDIS_URL: redis://cv-redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: cv-kafka:9092
      FRONTEND_URL: http://localhost:8080
      APP_ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - cloudvisor
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─── Connector Service (port 8000) ────────────────────────────────────────

  connector-service:
    build:
      context: .
      dockerfile: services/connector/Dockerfile
    container_name: cv-connector
    ports:
      - "8000:8000"
    env_file:
      - services/connector/.env
    environment:
      # Docker network overrides
      DB_URL: postgresql+asyncpg://cvadmin:${POSTGRES_PASSWORD:-cvpassword}@cv-postgres:5432/cloudvisor
      REDIS_URL: redis://cv-redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: cv-kafka:9092
      APP_ENVIRONMENT: production
      # Vault — use container name and token file written by vault-init
      VAULT_ENABLED: "true"
      VAULT_URL: http://cv-vault:8200
      VAULT_TOKEN: ""
      VAULT_TOKEN_FILE: /vault/data/vault_token
      VAULT_MOUNT_POINT: cloudvisor/credentials
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      schema-registry:
        condition: service_healthy
      vault:
        condition: service_started
      vault-init:
        condition: service_started
    networks:
      - cloudvisor
    restart: unless-stopped
    volumes:
      - vault_data:/vault/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Graph Service (port 8001) ────────────────────────────────────────────

  graph-service:
    build:
      context: .
      dockerfile: services/graph/Dockerfile
    container_name: cv-graph
    ports:
      - "8001:8001"
    env_file:
      - services/graph/.env
    environment:
      # Docker network overrides
      DB_URL: postgresql+asyncpg://cvadmin:${POSTGRES_PASSWORD:-cvpassword}@cv-postgres:5432/cloudvisor
      REDIS_URL: redis://cv-redis:6379/1
      KAFKA_BOOTSTRAP_SERVERS: cv-kafka:9092
      APP_ENVIRONMENT: production
      GRAPH_NEO4J_URI: bolt://cv-neo4j:7687
      GRAPH_ELASTICSEARCH_URL: http://cv-elasticsearch:9200
      ELASTICSEARCH_USERNAME: ${ELASTIC_USERNAME:-elastic}
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:-elasticpassword}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      neo4j:
        condition: service_started
      elasticsearch:
        condition: service_started
    networks:
      - cloudvisor
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─── Policy Service (port 8003) ───────────────────────────────────────────

  policy-service:
    build:
      context: .
      dockerfile: services/policy/Dockerfile
    container_name: cv-policy
    ports:
      - "8003:8003"
    env_file:
      - services/policy/.env
    environment:
      # Docker network overrides
      DB_URL: postgresql+asyncpg://cvadmin:${POSTGRES_PASSWORD:-cvpassword}@cv-postgres:5432/cloudvisor
      REDIS_URL: redis://cv-redis:6379/2
      KAFKA_BOOTSTRAP_SERVERS: cv-kafka:9092
      APP_ENVIRONMENT: production
      POLICY_OPA_URL: http://cv-opa:8181
      POLICY_RULES_REPO_PATH: /app/rules/rego
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      opa:
        condition: service_started
    networks:
      - cloudvisor
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─── Alert Service (port 8004) ────────────────────────────────────────────

  alert-service:
    build:
      context: .
      dockerfile: services/alert/Dockerfile
    container_name: cv-alert
    ports:
      - "8004:8004"
    env_file:
      - services/alert/.env
    environment:
      # Docker network overrides
      DB_URL: postgresql+asyncpg://cvadmin:${POSTGRES_PASSWORD:-cvpassword}@cv-postgres:5432/cloudvisor
      REDIS_URL: redis://cv-redis:6379/3
      KAFKA_BOOTSTRAP_SERVERS: cv-kafka:9092
      APP_ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - cloudvisor
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─── Public API Gateway (port 8005) ──────────────────────────────────────

  api-service:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: cv-api
    ports:
      - "8005:8005"
    env_file:
      - services/api/.env
    environment:
      # Docker network overrides
      REDIS_URL: redis://cv-redis:6379/4
      APP_ENVIRONMENT: production
      API_AUTH_SERVICE_URL: http://cv-auth:8002
      API_CONNECTOR_SERVICE_URL: http://cv-connector:8000
      API_GRAPH_SERVICE_URL: http://cv-graph:8001
      API_POLICY_SERVICE_URL: http://cv-policy:8003
      API_ALERT_SERVICE_URL: http://cv-alert:8004
      API_CSPM_SERVICE_URL: http://cv-cspm:8006
      API_COPILOT_SERVICE_URL: http://cv-copilot:8010
      API_KEEP_SERVICE_URL: http://cv-keep:8007
      API_AI_ROUTER_SERVICE_URL: http://cv-ai-router:8015
    depends_on:
      redis:
        condition: service_started
      auth-service:
        condition: service_started
      connector-service:
        condition: service_started
    networks:
      - cloudvisor
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── CSPM Service (port 8006) ─────────────────────────────────────────────

  cspm-service:
    build:
      context: .
      dockerfile: services/security/cspm/Dockerfile
    container_name: cv-cspm
    ports:
      - "8006:8006"
    env_file:
      - services/security/cspm/.env
    environment:
      # Docker network overrides
      DB_URL: postgresql+asyncpg://cvadmin:${POSTGRES_PASSWORD:-cvpassword}@cv-postgres:5432/cloudvisor
      REDIS_URL: redis://cv-redis:6379/5
      KAFKA_BOOTSTRAP_SERVERS: cv-kafka:9092
      APP_ENVIRONMENT: production
      POLICY_SERVICE_URL: http://cv-policy:8003
      ALERT_SERVICE_URL: http://cv-alert:8004
      AUTH_SERVICE_URL: http://cv-auth:8002
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      policy-service:
        condition: service_started
      alert-service:
        condition: service_started
    networks:
      - cloudvisor
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Copilot Service / CloudVisor Q (port 8010) ───────────────────────────

  copilot-service:
    build:
      context: .
      dockerfile: services/copilot/Dockerfile
    container_name: cv-copilot
    ports:
      - "8010:8010"
    env_file:
      - services/copilot/.env
    environment:
      # Docker network overrides
      DB_URL: postgresql+asyncpg://cvadmin:${POSTGRES_PASSWORD:-cvpassword}@cv-postgres:5432/cloudvisor
      REDIS_URL: redis://cv-redis:6379/6
      KAFKA_BOOTSTRAP_SERVERS: cv-kafka:9092
      APP_ENVIRONMENT: production
      COPILOT_LLM_PROVIDER: nvidia
      # SECURITY: Load the API key from an environment variable or .env file.
      # Never hardcode API keys in docker-compose.yml — they end up in git history.
      # Set COPILOT_NVIDIA_API_KEY in your .env file or CI/CD secrets.
      COPILOT_NVIDIA_API_KEY: ${COPILOT_NVIDIA_API_KEY}
      COPILOT_NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
      COPILOT_NVIDIA_MODEL: qwen/qwen3-coder-480b-a35b-instruct
      COPILOT_NVIDIA_MAX_TOKENS: "4096"
      COPILOT_NVIDIA_TEMPERATURE: "0.7"
      COPILOT_GRAPH_SERVICE_URL: http://cv-graph:8001
      COPILOT_POLICY_SERVICE_URL: http://cv-policy:8003
      COPILOT_ELASTICSEARCH_URL: http://cv-elasticsearch:9200
      ELASTICSEARCH_USERNAME: ${ELASTIC_USERNAME:-elastic}
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:-elasticpassword}
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      elasticsearch:
        condition: service_started
      graph-service:
        condition: service_started
      policy-service:
        condition: service_started
    networks:
      - cloudvisor
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Soketi WebSocket Server (ports 6001, 9601) ─────────────────────────────

  soketi:
    image: quay.io/soketi/soketi:1.6-16-debian
    container_name: cv-soketi
    ports:
      - "6001:6001"
      - "9601:9601"
    environment:
      SOKETI_DEFAULT_APP_ID: cloudvisor
      SOKETI_DEFAULT_APP_KEY: cloudvisor-key
      SOKETI_DEFAULT_APP_SECRET: cloudvisor-secret
      SOKETI_DEFAULT_APP_MAX_CONNS: "100"
      SOKETI_DEFAULT_APP_ENABLE_CLIENT_MESSAGES: "true"
      SOKETI_PORT: "6001"
      SOKETI_METRICS_SERVER_PORT: "9601"
    networks:
      - cloudvisor
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9601"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Keep AIOps Service (port 8007) ───────────────────────────────────────

  keep-service:
    build:
      context: .
      dockerfile: services/keep/Dockerfile
    container_name: cv-keep
    ports:
      - "8007:8007"
    environment:
      AUTH_TYPE: NOAUTH
      KEEP_TENANT_FROM_HEADER: "true"
      DATABASE_CONNECTION_STRING: postgresql://cvadmin:${POSTGRES_PASSWORD:-cvpassword}@cv-postgres:5432/cloudvisor
      KAFKA_BOOTSTRAP_SERVERS: cv-kafka:9092
      KAFKA_TOPIC: cloudvisor.alerts
      KAFKA_GROUP_ID: keep-alert-ingestion
      REDIS_URL: redis://cv-redis:6379/7
      PUSHER_APP_ID: cloudvisor
      PUSHER_APP_KEY: cloudvisor-key
      PUSHER_APP_SECRET: cloudvisor-secret
      PUSHER_HOST: cv-soketi
      PUSHER_PORT: "6001"
      KEEP_API_URL: http://cv-keep:8007
      PORT: "8007"
      PYTHONUNBUFFERED: "1"
      SECRET_MANAGER_TYPE: FILE
      SECRET_MANAGER_DIRECTORY: /state
      PROVISION_RESOURCES: "false"
      SCHEDULER: "false"
      CONSUMER: "false"
      # AI Router - unified LLM gateway (replaces direct OpenAI/NVIDIA calls)
      AI_ROUTER_URL: http://cv-ai-router:8015/v1
      # Fallback: direct NVIDIA for legacy compatibility
      OPENAI_API_KEY: ${COPILOT_NVIDIA_API_KEY:-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}
      OPENAI_BASE_URL: https://integrate.api.nvidia.com/v1
      OPENAI_MODEL_NAME: meta/llama-3.1-8b-instruct
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
      soketi:
        condition: service_started
      ai-router:
        condition: service_started
    networks:
      - cloudvisor
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - keep_state:/state
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

  # ─── CloudVisor Web Frontend (port 3000) ──────────────────────────────────

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: cv-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # All API calls go through nginx same-origin proxy (/auth/, /v1/, etc.)
      # No direct service URLs needed — HttpOnly cookies work on same origin
      # NEXT_PUBLIC_ vars are baked into the JS at BUILD time, set them here
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      NEXT_PUBLIC_API_URL_CLIENT: http://localhost:8080/v1/keep
      NEXT_PUBLIC_PUSHER_KEY: cloudvisor-key
      NEXT_PUBLIC_PUSHER_HOST: localhost
      NEXT_PUBLIC_PUSHER_PORT: "6001"
      API_URL: http://cv-keep:8007
      # AI Router - unified LLM gateway for CopilotKit
      AI_ROUTER_URL: http://cv-ai-router:8015/v1
      AI_ROUTER_MODEL: meta/llama-llama-3.3-70b-instruct:free
      # Fallback: direct NVIDIA for legacy compatibility
      OPEN_AI_API_KEY: ${COPILOT_NVIDIA_API_KEY:-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}
      OPENAI_BASE_URL: https://integrate.api.nvidia.com/v1
      OPENAI_MODEL_NAME: meta/llama-3.1-8b-instruct
    depends_on:
      - api-service
      - ai-router
    networks:
      - cloudvisor
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── AI Router Service (port 8015) ───────────────────────────────────────
  # Unified LLM gateway for OpenAI, OpenRouter, NVIDIA NIM

  ai-router:
    build:
      context: .
      dockerfile: services/ai-router/Dockerfile
    container_name: cv-ai-router
    ports:
      - "8015:8015"
    env_file:
      - services/ai-router/.env
    environment:
      APP_ENVIRONMENT: production
      PORT: "8015"
      # Provider configurations (fallbacks)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-openai}
      RATE_LIMIT_RPM: "60"
      REQUEST_TIMEOUT: "60"
      MAX_TOKENS: "4096"
      REDIS_URL: redis://cv-redis:6379/8
      ENABLE_CACHE: "true"
    depends_on:
      redis:
        condition: service_started
    networks:
      - cloudvisor
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8015/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  esdata1:
  postgres_data:
  neo4j_data:
  vault_data:
  vault_logs:
  keep_state:


