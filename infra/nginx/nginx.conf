# Docker embedded DNS resolver — enables dynamic hostname resolution
# so upstream containers can come up in any order.
# Using variables in proxy_pass forces runtime resolution (not startup).

server {
    listen 80;
    server_name localhost;

    # Docker internal DNS with short TTL — re-resolves if containers restart
    resolver 127.0.0.11 valid=5s ipv6=off;

    # ─── Gzip compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # ─── Security Headers ─────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.copilotkit.ai https://openrouter.ai https://integrate.api.nvidia.com; connect-src 'self' https://cdn.copilotkit.ai https://openrouter.ai https://integrate.api.nvidia.com wss: ws: http://localhost:*; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com;" always;

    # ─── Size limits ──────────────────────────────────────────────────────────
    client_max_body_size 10M;
    proxy_buffer_size 4k;

    # ─── Proxy settings ───────────────────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ─── Auth Service (/auth/*) — same-origin proxy for HttpOnly cookies ──────
    # IMPORTANT: /auth/callback/success is a Next.js page, NOT an auth service route.
    # This must be matched BEFORE the generic /auth/ location.
    location /auth/callback/success {
        set $web_upstream http://cv-web:3000;
        proxy_pass $web_upstream;
        proxy_cookie_path /auth/ /;
    }

    location /auth/ {
        set $auth_upstream http://cv-auth:8002;
        rewrite ^/auth/(.*) /auth/$1 break;
        proxy_pass $auth_upstream;
        proxy_cookie_path /auth/ /;
        proxy_set_header X-Forwarded-Prefix /auth;
    }

    # Admin auth
    location /admin/auth/ {
        set $auth_upstream http://cv-auth:8002;
        rewrite ^/admin/auth/(.*) /admin/auth/$1 break;
        proxy_pass $auth_upstream;
        proxy_cookie_path /admin/auth/ /;
    }

    # Internal auth (service-to-service only — block external access)
    location /internal/ {
        return 403;
    }

    # Auth health check
    location = /auth/health {
        set $auth_upstream http://cv-auth:8002;
        rewrite ^/auth/health /health break;
        proxy_pass $auth_upstream;
    }

    # ─── Copilot Service (/v1/copilot/*) ─────────────────────────────────────
    location /v1/copilot/ {
        set $copilot_upstream http://cv-copilot:8010;
        proxy_pass $copilot_upstream;
        proxy_read_timeout 60s;
    }

    # ─── API Gateway (/v1/*) ──────────────────────────────────────────────────
    location /v1/ {
        set $api_upstream http://cv-api:8005;
        proxy_pass $api_upstream;
        proxy_read_timeout 30s;
    }

    # ─── Connector Service (direct — for cloud accounts) ─────────────────────
    location /connector/ {
        set $connector_upstream http://cv-connector:8000;
        rewrite ^/connector/(.*) /$1 break;
        proxy_pass $connector_upstream;
        proxy_read_timeout 30s;
    }

    # API gateway health
    location = /api/health {
        set $api_upstream http://cv-api:8005;
        rewrite ^/api/health /health break;
        proxy_pass $api_upstream;
    }

    # ─── WebSocket (Soketi/Pusher) — long-lived connections ───────────────────
    # Must be before generic / location to match correctly
    location /app/ {
        set $soketi_upstream http://cv-soketi:6001;
        proxy_pass $soketi_upstream/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location = /app {
        set $soketi_upstream http://cv-soketi:6001;
        proxy_pass $soketi_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # ─── Next.js HMR / static assets ─────────────────────────────────────────
    location /_next/ {
        set $web_upstream http://cv-web:3000;
        proxy_pass $web_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ─── Web App (everything else) — Next.js frontend ─────────────────────────
    location / {
        set $web_upstream http://cv-web:3000;
        proxy_pass $web_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
