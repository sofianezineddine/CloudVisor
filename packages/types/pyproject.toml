[project]
name = "cloudvisor-types"
version = "0.1.0"
description = "Shared Python dataclasses and TypeScript interfaces for CloudVisor"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "mypy", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cloudvisor_types"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
